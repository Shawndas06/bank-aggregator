# Disposable smoke environment. No host source mounts or production credentials.
name: bank-ci
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: bank_ci
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ci -d bank_ci']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ci:ci@postgres:5432/bank_ci
      REDIS_HOST: redis
      SECRET_KEY: ci-only-not-a-production-secret
      SMTP_ENABLED: 'false'
      DEBUG: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,json; d=json.load(urllib.request.urlopen('http://localhost:8000/health'))['data']; assert d['api']==d['redis']=='healthy'"]
      interval: 3s
      timeout: 5s
      retries: 30
  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      backend:
        condition: service_healthy
    ports: ['127.0.0.1:8080:80']
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost/health]
      interval: 3s
      timeout: 3s
      retries: 20
